[project]
name = "agent-guard"
version = "0.1.0"
description = "Policy-as-code for AI agent permissions. Define bounded permissions in YAML, enforce at runtime."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yunare Maia", email = "yunare@gmail.com"}]
keywords = ["ai-agent", "permissions", "policy", "security", "guard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["pyyaml>=6.0", "click>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
agent-guard = "src.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_guard"]

[tool.ruff]
line-length = 100
target-version = "py310"
