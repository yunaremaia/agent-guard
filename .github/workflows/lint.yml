name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned ruff
        # Pinned to an exact version on purpose so CI and local runs agree and
        # the rule set cannot shift under us. Bump it deliberately in a PR.
        run: pip install "ruff==0.16.10"
      - name: Run ruff (src/)
        run: ruff check --no-cache src/
      - name: Run ruff (tests/)
        run: ruff check --no-cache tests/
      - name: Run ruff (combined)
        run: ruff check --no-cache src/ tests/